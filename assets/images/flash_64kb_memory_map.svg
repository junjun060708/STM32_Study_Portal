<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="900" height="560" fill="#070a13" rx="12"/>
  <rect x="2" y="2" width="896" height="556" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>

  <!-- 标题 -->
  <text x="30" y="38" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="18" font-weight="bold">STM32F103C8T6 内部 Flash 64KB 物理扇区与地址映射图</text>
  <text x="30" y="58" fill="#64748b" font-family="sans-serif" font-size="12">江科大 P48 [15-1] 闪存架构与模拟 EEPROM 掉电存储 · 矢量高清图解</text>

  <!-- ================= 左侧: Flash 存储块组织结构 ================= -->
  <g transform="translate(40, 85)">
    <rect width="360" height="440" fill="rgba(15, 23, 42, 0.7)" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="360" height="34" fill="rgba(56, 189, 248, 0.15)" rx="8"/>
    <text x="15" y="22" fill="#38bdf8" font-size="13" font-weight="bold">主存储器块 (Main Flash: 64KB / 64页)</text>

    <!-- Page 0: 中断向量表与代码起点 -->
    <rect x="15" y="45" width="330" height="42" fill="rgba(2, 132, 199, 0.3)" stroke="#38bdf8" rx="4"/>
    <text x="25" y="65" fill="#7dd3fc" font-size="11" font-weight="bold">Page 0 (1KB): 0x0800 0000 ~ 0x0800 03FF</text>
    <text x="25" y="80" fill="#94a3b8" font-size="10">栈顶指针 MSP + 中断向量表 + Reset_Handler</text>

    <!-- Page 1 ~ 61: 用户固件区 -->
    <rect x="15" y="95" width="330" height="90" fill="rgba(2, 132, 199, 0.15)" stroke="rgba(56, 189, 248, 0.4)" rx="4"/>
    <text x="25" y="125" fill="#bae6fd" font-size="12" font-weight="bold">Page 1 ~ Page 61 (共 61KB)</text>
    <text x="25" y="145" fill="#cbd5e1" font-size="11">存放编译生成的机器码、用户 main() 逻辑与只读常量</text>
    <text x="25" y="165" fill="#94a3b8" font-size="10">范围: 0x0800 0400 ~ 0x0800 F7FF</text>

    <!-- Page 62: 保留缓冲页 -->
    <rect x="15" y="195" width="330" height="40" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" rx="4"/>
    <text x="25" y="215" fill="#94a3b8" font-size="11">Page 62 (1KB): 缓冲保留页</text>
    <text x="25" y="228" fill="#64748b" font-size="10">0x0800 F800 ~ 0x0800 FBFF (防止代码膨胀溢出)</text>

    <!-- Page 63: 最后一页用户掉电存储区 -->
    <rect x="15" y="245" width="330" height="75" fill="rgba(0, 255, 136, 0.18)" stroke="#00ff88" stroke-width="1.8" rx="4"/>
    <text x="25" y="268" fill="#00ff88" font-size="12" font-weight="bold">★ Page 63 最后一页 (模拟 EEPROM 用户存储区)</text>
    <text x="25" y="288" fill="#a7f3d0" font-size="11">起始基地址: 0x0800 FC00 ~ 0x0800 FFFF (1024 字节)</text>
    <text x="25" y="306" fill="#6ee7b7" font-size="10.5">掉电保存参数、设备密码、系统历史最高记录</text>

    <!-- 信息块与选项字节 -->
    <rect x="15" y="330" width="330" height="95" fill="#1e293b" rx="4"/>
    <text x="25" y="352" fill="#facc15" font-size="11.5" font-weight="bold">信息块 (Information Block):</text>
    <text x="25" y="372" fill="#cbd5e1" font-size="11">• 系统存储器 (0x1FFFF000): 内置串口 Bootloader</text>
    <text x="25" y="392" fill="#cbd5e1" font-size="11">• 选项字节 (0x1FFFF800): 读保护 (RDP) 开启防止抄板</text>
    <text x="25" y="412" fill="#cbd5e1" font-size="11">• 96 位唯一 UID (0x1FFFF7E8): 芯片全球身份证</text>
  </g>

  <!-- ================= 右侧: 先擦后写的物理状态机 ================= -->
  <g transform="translate(440, 85)">
    <rect width="420" height="440" fill="rgba(15, 23, 42, 0.7)" stroke="#c084fc" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="420" height="34" fill="rgba(192, 132, 252, 0.15)" rx="8"/>
    <text x="15" y="22" fill="#c084fc" font-size="13" font-weight="bold">⚡ Flash 擦除与写入底层物理铁律</text>

    <!-- 步骤 1: 擦除 -->
    <g transform="translate(20, 50)">
      <rect width="380" height="95" fill="#1e293b" stroke="#ef4444" stroke-width="1" rx="6"/>
      <text x="15" y="25" fill="#ef4444" font-size="13" font-weight="bold">步骤 1：整页擦除 (FLASH_ErasePage)</text>
      <text x="15" y="48" fill="#cbd5e1" font-size="11.5">Flash 只能将位由 1 改为 0，不能将 0 改为 1！</text>
      <text x="15" y="68" fill="#fca5a5" font-size="11">擦除必须以【整页 1024 字节】为单位，擦除后所有位全为 1：</text>
      <text x="15" y="85" fill="#facc15" font-family="monospace" font-size="11">数据重置为: 0xFF, 0xFF, 0xFF, 0xFF ... (全高电平)</text>
    </g>

    <!-- 连接线 -->
    <line x1="210" y1="150" x2="210" y2="180" stroke="#c084fc" stroke-width="2"/>

    <!-- 步骤 2: 写入 -->
    <g transform="translate(20, 180)">
      <rect width="380" height="95" fill="#1e293b" stroke="#00ff88" stroke-width="1" rx="6"/>
      <text x="15" y="25" fill="#00ff88" font-size="13" font-weight="bold">步骤 2：半字/字编程 (FLASH_ProgramHalfWord)</text>
      <text x="15" y="48" fill="#cbd5e1" font-size="11.5">向空白页写入数据，硬件将对应的位选择性注入电荷拉低为 0：</text>
      <text x="15" y="68" fill="#6ee7b7" font-size="11">写入 0xA55A (0b1010010101011010)：</text>
      <text x="15" y="85" fill="#00ff88" font-family="monospace" font-size="11">写入后结果: 0xA55A 牢固存入硅片，掉电几十年不丢失！</text>
    </g>

    <!-- 避坑与锁机制 -->
    <g transform="translate(20, 310)">
      <rect width="380" height="110" fill="#0f172a" stroke="#f59e0b" stroke-width="1" rx="6"/>
      <text x="15" y="24" fill="#f59e0b" font-size="12" font-weight="bold">🛡️ 闪存保险箱双钥匙开锁机制：</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="11">• 钥匙 1: 向 KEYR 写入 KEY1 = 0x45670123</text>
      <text x="15" y="64" fill="#cbd5e1" font-size="11">• 钥匙 2: 向 KEYR 写入 KEY2 = 0xCDEF89AB</text>
      <text x="15" y="82" fill="#cbd5e1" font-size="11">• 操作完毕：立即执行 FLASH_Lock() 重新锁死防跑飞！</text>
      <text x="15" y="100" fill="#ef4444" font-size="11" font-weight="bold">★ 铁律：擦除前必须绝对确认擦的是 Page 63，严禁擦 Page 0！</text>
    </g>
  </g>
</svg>
