<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="900" height="520" fill="#070a13" rx="12"/>
  <rect x="2" y="2" width="896" height="516" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>

  <!-- 标题 -->
  <text x="30" y="38" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="18" font-weight="bold">I2C 总线完整通信时序与应答机制图解</text>
  <text x="30" y="58" fill="#64748b" font-family="sans-serif" font-size="12">江科大 P31 [10-1] 通信协议核心规则 · 矢量高清图解</text>

  <!-- 图形主视区 -->
  <g transform="translate(40, 80)">
    <!-- 坐标背景底框 -->
    <rect width="820" height="260" fill="#090e1a" stroke="#1e293b" rx="8"/>

    <!-- SCL 标头 -->
    <text x="20" y="75" fill="#facc15" font-family="monospace" font-size="14" font-weight="bold">SCL (时钟)</text>
    <!-- SDA 标头 -->
    <text x="20" y="175" fill="#00f0ff" font-family="monospace" font-size="14" font-weight="bold">SDA (数据)</text>

    <!-- ================= SCL 时钟波形 ================= -->
    <!-- 150 之前空闲高电平，150 到 650 之间时钟脉冲，650 之后停止恢复高电平 -->
    <path d="M 120 60 L 170 60 
             L 180 90 L 210 90 L 210 60 L 240 60 
             L 250 90 L 280 90 L 280 60 L 310 60 
             L 320 90 L 350 90 L 350 60 L 380 60 
             L 390 90 L 420 90 L 420 60 L 450 60 
             L 460 90 L 490 90 L 490 60 L 520 60 
             L 530 90 L 560 90 L 560 60 L 590 60 
             L 600 90 L 630 90 L 630 60 L 660 60 
             L 670 90 L 700 90 L 700 60 L 730 60 
             L 740 90 L 770 90 L 770 60 L 800 60" 
          fill="none" stroke="#facc15" stroke-width="2.5"/>

    <!-- ================= SDA 数据波形 ================= -->
    <!-- 起始条件: SCL为高时SDA下降沿 -->
    <path d="M 120 150 L 150 150 L 160 190 L 220 190 
             L 230 150 L 300 150 L 310 190 L 400 190 
             L 410 150 L 580 150 
             L 590 190 L 680 190 
             L 690 150 L 780 150 L 790 190 L 800 150" 
          fill="none" stroke="#00f0ff" stroke-width="2.5"/>

    <!-- 起始信号标注框 -->
    <rect x="135" y="20" width="55" height="210" fill="rgba(0, 240, 255, 0.08)" stroke="#00f0ff" stroke-dasharray="3,3" rx="4"/>
    <text x="162" y="220" fill="#00f0ff" font-size="11" text-anchor="middle" font-weight="bold">起始信号 (Start)</text>

    <!-- 数据有效性区间标注 -->
    <rect x="235" y="20" width="410" height="210" fill="rgba(56, 189, 248, 0.04)" rx="4"/>
    <text x="440" y="40" fill="#cbd5e1" font-size="11" text-anchor="middle">数据位传输: SCL 为高时 SDA 必须保持稳定；SCL 为低时允许 SDA 翻转改写</text>

    <!-- 第9位 ACK 从机应答标注框 -->
    <rect x="655" y="20" width="65" height="210" fill="rgba(0, 255, 136, 0.12)" stroke="#00ff88" stroke-dasharray="3,3" rx="4"/>
    <text x="687" y="220" fill="#00ff88" font-size="11" text-anchor="middle" font-weight="bold">第9位 ACK 应答</text>

    <!-- 停止信号标注框 -->
    <rect x="740" y="20" width="60" height="210" fill="rgba(239, 68, 68, 0.08)" stroke="#ef4444" stroke-dasharray="3,3" rx="4"/>
    <text x="770" y="220" fill="#ef4444" font-size="11" text-anchor="middle" font-weight="bold">停止信号 (Stop)</text>
  </g>

  <!-- 底部核心时序口诀 -->
  <g transform="translate(40, 360)">
    <rect width="820" height="135" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" rx="8"/>
    <text x="20" y="30" fill="#facc15" font-size="14" font-weight="bold">💡 I2C 通信时序四大铁律口诀（江科大精髓总结）：</text>
    
    <text x="20" y="60" fill="#cbd5e1" font-size="12.5">• <strong style="color:#00f0ff;">起始条件 (Start)：</strong>SCL 保持高电平期间，SDA 突然产生下降沿跳水。</text>
    <text x="20" y="85" fill="#cbd5e1" font-size="12.5">• <strong style="color:#facc15;">数据传输 (Data)：</strong>发送 8 位数据（高位 MSB 先发）。SCL 高电平期间读数据，SCL 低电平期间写数据。</text>
    <text x="20" y="110" fill="#cbd5e1" font-size="12.5">• <strong style="color:#00ff88;">从机应答 (ACK)：</strong>在第 9 个时钟脉冲，主机松手释放 SDA，从机强力下拉 SDA 到低电平表示“我收到啦！”。</text>
    <text x="20" y="132" fill="#cbd5e1" font-size="12.5">• <strong style="color:#ef4444;">停止条件 (Stop)：</strong>SCL 保持高电平期间，SDA 产生上升沿，总线恢复空闲高电平。</text>
  </g>
</svg>
