<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="900" height="520" fill="#070a13" rx="12"/>
  <rect x="2" y="2" width="896" height="516" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>

  <!-- 标题 -->
  <text x="30" y="38" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="18" font-weight="bold">RTC 实时时钟与 BKP 备份寄存器 硬件架构拓扑图</text>
  <text x="30" y="58" fill="#64748b" font-family="sans-serif" font-size="12">江科大 P42 [12-2] 备份域与秒计数器时钟链路 · 矢量高清图解</text>

  <!-- ================= 拓扑框图 ================= -->
  <g transform="translate(50, 90)">
    <!-- 备份域虚线外框 -->
    <rect width="800" height="280" fill="rgba(0, 255, 136, 0.03)" stroke="#00ff88" stroke-dasharray="4,4" rx="8"/>
    <text x="20" y="30" fill="#00ff88" font-size="13" font-weight="bold">VBAT 备份供电域 (由纽扣电池维持不掉电)</text>

    <!-- 1. 时钟源选择器 MUX -->
    <rect x="30" y="60" width="160" height="180" fill="#1e293b" stroke="#38bdf8" rx="6"/>
    <text x="110" y="85" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="bold">RTC 时钟选择器</text>
    
    <rect x="40" y="100" width="140" height="30" fill="rgba(0, 255, 136, 0.2)" stroke="#00ff88" rx="4"/>
    <text x="50" y="120" fill="#a7f3d0" font-size="11" font-weight="bold">★ LSE: 32.768kHz</text>
    
    <rect x="40" y="140" width="140" height="30" fill="rgba(255, 255, 255, 0.05)" rx="4"/>
    <text x="50" y="160" fill="#94a3b8" font-size="11">LSI: ~40kHz</text>

    <rect x="40" y="180" width="140" height="30" fill="rgba(255, 255, 255, 0.05)" rx="4"/>
    <text x="50" y="200" fill="#94a3b8" font-size="11">HSE: 8MHz / 128</text>

    <!-- 连接线 1 -->
    <line x1="190" y1="150" x2="250" y2="150" stroke="#00f0ff" stroke-width="2.5"/>

    <!-- 2. 预分频器 PRL -->
    <rect x="250" y="90" width="170" height="120" fill="#1e293b" stroke="#facc15" rx="6"/>
    <text x="335" y="120" fill="#facc15" font-size="13" text-anchor="middle" font-weight="bold">RTC 预分频器</text>
    <text x="335" y="145" fill="#cbd5e1" font-size="11.5" text-anchor="middle">RTC_PRL = 32767</text>
    <text x="335" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">32768Hz / 32768</text>
    <rect x="265" y="185" width="140" height="18" fill="rgba(250, 204, 21, 0.15)" rx="3"/>
    <text x="335" y="198" fill="#facc15" font-size="10" text-anchor="middle" font-weight="bold">输出 1Hz 秒脉冲</text>

    <!-- 连接线 2 -->
    <line x1="420" y1="150" x2="480" y2="150" stroke="#00f0ff" stroke-width="2.5"/>

    <!-- 3. 32位秒计数器 CNT -->
    <rect x="480" y="90" width="170" height="120" fill="rgba(2, 132, 199, 0.25)" stroke="#38bdf8" rx="6"/>
    <text x="565" y="120" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="bold">32 位秒计数器</text>
    <text x="565" y="145" fill="#f8fafc" font-size="11.5" text-anchor="middle">RTC_CNT</text>
    <text x="565" y="170" fill="#94a3b8" font-size="10.5" text-anchor="middle">每 1 秒递增 1 次</text>
    <text x="565" y="195" fill="#7dd3fc" font-size="10.5" text-anchor="middle">Unix 时间戳对应秒数</text>

    <!-- 4. BKP 备份寄存器 -->
    <rect x="680" y="90" width="100" height="120" fill="#1e293b" stroke="#00ff88" rx="6"/>
    <text x="730" y="120" fill="#00ff88" font-size="12" text-anchor="middle" font-weight="bold">BKP 寄存器</text>
    <text x="730" y="145" fill="#a7f3d0" font-size="10.5" text-anchor="middle">BKP_DR1~10</text>
    <text x="730" y="170" fill="#94a3b8" font-size="10" text-anchor="middle">写 0xA5A5</text>
    <text x="730" y="190" fill="#facc15" font-size="10" text-anchor="middle">防重复初始化</text>
  </g>

  <!-- 底部说明框 -->
  <g transform="translate(50, 390)">
    <rect width="800" height="100" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" rx="8"/>
    <text x="20" y="28" fill="#facc15" font-size="13" font-weight="bold">📌 江科大核心考点精要：</text>
    <text x="20" y="52" fill="#cbd5e1" font-size="12">• 为什么需要 32.768kHz 晶振？因为 \(32768 = 2^{15}\)，只需通过 15 次 2 分频，即可极其平整地得到整整 1.0Hz (精确 1 秒)！</text>
    <text x="20" y="75" fill="#cbd5e1" font-size="12">• BKP 备份寄存器由 VBAT 供电，复位不丢失；一旦外壳微动开关触发 TAMPER 引脚，硬件会自动瞬间抹除所有数据防止商业泄密！</text>
  </g>
</svg>
