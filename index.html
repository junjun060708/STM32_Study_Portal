<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STM32F103 进阶极客研习社 - 江科大进阶实战工作台</title>
  <link rel="stylesheet" href="css/style.css?v=2.2">
</head>
<body>

  <!-- ================= 顶部 HUD 硬件监视栏 ================= -->
  <header class="hud-header">
    <div class="hud-logo">
      <div class="hud-chip-icon">M3</div>
      <div class="hud-title-wrap">
        <h1>
          <span>STM32F103 学习工作台</span>
          <span class="hud-badge">STD-LIB V3.5.0</span>
        </h1>
      </div>
    </div>

    <!-- 硬件状态监控 Pill 组 -->
    <div class="hud-status-group">
      <div class="hud-pill">
        <span class="hud-dot"></span>
        <span>主频: <strong id="hud-freq" style="color: var(--cyan-primary);">72MHz</strong></span>
      </div>
      <div class="hud-pill">
        <span>模式: <strong id="hud-mode" style="color: var(--green-neon);">SYS_ACTIVE</strong></span>
      </div>
      <div class="hud-pill" id="hud-progress">
        <span>学习打卡: <strong style="color:var(--green-neon);">0/17</strong> (0%)</span>
      </div>
    </div>

    <!-- 手机端汉堡折叠按钮 -->
    <button class="hud-mobile-toggle" id="mobile-toggle">
      ☰ 选集目录
    </button>
  </header>

  <!-- 手机端侧边栏遮罩 -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- ================= 主应用布局 ================= -->
  <div class="app-container">
    
    <!-- 左侧章节导航抽屉 (手风琴分类 + 实时搜索) -->
    <aside class="sidebar" id="sidebar">
      
      <!-- 搜索过滤栏 -->
      <div class="sidebar-search-box">
        <span class="search-icon-pos">🔍</span>
        <input type="text" id="nav-search" class="nav-search-input" placeholder="搜索外设/原理 (如: 低功耗, 看门狗, Flash)...">
      </div>

      <!-- 分类章节导航列表 -->
      <nav class="chapter-nav-list" id="chapter-nav">
        <!-- 由 js/app.js 动态填充 -->
      </nav>

      <!-- 底部硬件安全提示 -->
      <div class="sidebar-bottom-info">
        <strong>⚠️ 硬件安全与实战基准</strong><br>
        • ST-Link 保护：严禁复用 <code>PA13/PA14</code> 调试引脚。<br>
        • 板载 LED：默认 <code>PC13</code> 通用推挽输出，低电平点亮。<br>
        • 代码规范：STM32F10x 标准库 V3.5.0，UTF-8 编码。
      </div>
    </aside>

    <!-- 中右侧核心内容展示区 -->
    <main class="main-content" id="main-content">
      <!-- 由 js/app.js 动态渲染章节内容与动态交互沙盘 -->
    </main>

  </div>

  <!-- 引入逻辑脚本 (加版本号强制突破手机与浏览器本地缓存) -->
  <script src="js/data.js?v=2.2"></script>
  <script src="js/app.js?v=2.2"></script>
</body>
</html>
