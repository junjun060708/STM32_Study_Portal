<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="900" height="560" fill="#070a13" rx="12"/>
  <rect x="2" y="2" width="896" height="556" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>

  <!-- 标题 -->
  <text x="30" y="38" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="18" font-weight="bold">IWDG 独立看门狗 vs WWDG 窗口看门狗 内部原理链路对比</text>
  <text x="30" y="58" fill="#64748b" font-family="sans-serif" font-size="12">江科大 P46 [14-1] 硬件架构与喂狗窗口原理 · 矢量高清图解</text>

  <!-- ================= 左半区: IWDG 独立看门狗 ================= -->
  <g transform="translate(40, 85)">
    <rect width="390" height="440" fill="rgba(15, 23, 42, 0.7)" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="390" height="34" fill="rgba(56, 189, 248, 0.15)" rx="8"/>
    <text x="15" y="22" fill="#38bdf8" font-size="14" font-weight="bold">🛡️ IWDG 独立看门狗 (专防硬件卡死)</text>

    <!-- 时钟源 -->
    <rect x="20" y="50" width="350" height="45" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="2,2" rx="6"/>
    <text x="35" y="77" fill="#00f0ff" font-size="12" font-weight="bold">时钟源：内部低速 RC 振荡器 (LSI ~40kHz)</text>
    <text x="300" y="77" fill="#94a3b8" font-size="10">独立自主</text>

    <!-- 下拉箭头 -->
    <line x1="195" y1="95" x2="195" y2="120" stroke="#38bdf8" stroke-width="2"/>

    <!-- 预分频器 -->
    <rect x="20" y="120" width="350" height="45" fill="#1e293b" rx="6"/>
    <text x="35" y="147" fill="#f8fafc" font-size="12">8 位预分频器 (PR[2:0]): 4 ~ 256 分频</text>

    <!-- 下拉箭头 -->
    <line x1="195" y1="165" x2="195" y2="190" stroke="#38bdf8" stroke-width="2"/>

    <!-- 12位递减计数器 -->
    <rect x="20" y="190" width="350" height="60" fill="rgba(2, 132, 199, 0.2)" stroke="#38bdf8" rx="6"/>
    <text x="35" y="215" fill="#00f0ff" font-size="13" font-weight="bold">12 位递减计数器 (0xFFF -> 0x000)</text>
    <text x="35" y="235" fill="#94a3b8" font-size="11">喂狗操作：向 KR 写 0xAAAA 将重载值灌入计数器</text>

    <!-- 比较与复位 -->
    <line x1="195" y1="250" x2="195" y2="280" stroke="#ef4444" stroke-width="2"/>
    
    <rect x="20" y="280" width="350" height="50" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" rx="6"/>
    <text x="35" y="305" fill="#ef4444" font-size="13" font-weight="bold">计数器减到 0x000 -> 触发硬件系统复位！</text>
    <text x="35" y="322" fill="#fca5a5" font-size="10.5">无窗口上限限制，只要在跌到 0 前喂狗即可</text>

    <!-- 核心特性卡片 -->
    <rect x="20" y="345" width="350" height="75" fill="#0f172a" rx="6"/>
    <text x="30" y="368" fill="#facc15" font-size="11.5" font-weight="bold">★ 核心特性：</text>
    <text x="30" y="388" fill="#cbd5e1" font-size="11">• 哪怕主晶振 8MHz 被震坏停振，LSI 依旧正常工作</text>
    <text x="30" y="406" fill="#cbd5e1" font-size="11">• 一旦通过写 0xCCCC 启动，软件中途无法关闭！</text>
  </g>

  <!-- ================= 右半区: WWDG 窗口看门狗 ================= -->
  <g transform="translate(470, 85)">
    <rect width="390" height="440" fill="rgba(15, 23, 42, 0.7)" stroke="#c084fc" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="390" height="34" fill="rgba(192, 132, 252, 0.15)" rx="8"/>
    <text x="15" y="22" fill="#c084fc" font-size="14" font-weight="bold">⏱️ WWDG 窗口看门狗 (专防程序时序跑飞)</text>

    <!-- 时钟源 -->
    <rect x="20" y="50" width="350" height="45" fill="#1e293b" stroke="#c084fc" stroke-dasharray="2,2" rx="6"/>
    <text x="35" y="77" fill="#c084fc" font-size="12" font-weight="bold">时钟源：APB1 总线时钟 (PCLK1 / 4096)</text>
    <text x="290" y="77" fill="#94a3b8" font-size="10">与主时钟同源</text>

    <!-- 下拉箭头 -->
    <line x1="195" y1="95" x2="195" y2="120" stroke="#c084fc" stroke-width="2"/>

    <!-- 时基预分频器 -->
    <rect x="20" y="120" width="350" height="45" fill="#1e293b" rx="6"/>
    <text x="35" y="147" fill="#f8fafc" font-size="12">时基预分频 (WDGTB): 1, 2, 4, 8 分频</text>

    <!-- 下拉箭头 -->
    <line x1="195" y1="165" x2="195" y2="190" stroke="#c084fc" stroke-width="2"/>

    <!-- 7位递减计数器与窗口比较器 -->
    <rect x="20" y="190" width="350" height="60" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc" rx="6"/>
    <text x="35" y="215" fill="#c084fc" font-size="13" font-weight="bold">7 位递减计数器 T[6:0] 与窗口值 W[6:0]</text>
    <text x="35" y="235" fill="#94a3b8" font-size="11">黄金喂狗窗口：仅在 0x40 ≤ T &lt; W 时允许刷新</text>

    <!-- 比较与复位 -->
    <line x1="195" y1="250" x2="195" y2="280" stroke="#ef4444" stroke-width="2"/>
    
    <rect x="20" y="280" width="350" height="50" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" rx="6"/>
    <text x="35" y="302" fill="#ef4444" font-size="12" font-weight="bold">太早喂狗 (T > W) 或 超时 (T &lt; 0x40) -> 均复位！</text>
    <text x="35" y="320" fill="#fca5a5" font-size="10.5">当 T=0x40 时可触发 EWI 提前唤醒中断抢救现场</text>

    <!-- 核心特性卡片 -->
    <rect x="20" y="345" width="350" height="75" fill="#0f172a" rx="6"/>
    <text x="30" y="368" fill="#00ff88" font-size="11.5" font-weight="bold">★ 核心特性：</text>
    <text x="30" y="388" fill="#cbd5e1" font-size="11">• 能精准监测程序是否因为死循环而“高频早喂狗”</text>
    <text x="30" y="406" fill="#cbd5e1" font-size="11">• 适合对刷新周期有严格毫秒级要求的工控与汽车电子</text>
  </g>
</svg>
