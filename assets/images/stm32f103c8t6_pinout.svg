<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <radialGradient id="chipBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景底板 -->
  <rect width="900" height="620" fill="#070a13" rx="12"/>
  <rect x="2" y="2" width="896" height="616" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>

  <!-- 标题栏 -->
  <text x="30" y="40" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="18" font-weight="bold">STM32F103C8T6 (LQFP48) 核心引脚全景图</text>
  <text x="30" y="62" fill="#64748b" font-family="sans-serif" font-size="12">江科大教程常用引脚基准标注 · 矢量超清重制版</text>

  <!-- 图例 -->
  <g transform="translate(540, 26)">
    <rect x="0" y="0" width="12" height="12" fill="#ef4444" rx="2"/>
    <text x="18" y="10" fill="#cbd5e1" font-size="11">SWD调试保护</text>
    <rect x="110" y="0" width="12" height="12" fill="#00ff88" rx="2"/>
    <text x="128" y="10" fill="#cbd5e1" font-size="11">板载测试LED</text>
    <rect x="230" y="0" width="12" height="12" fill="#38bdf8" rx="2"/>
    <text x="248" y="10" fill="#cbd5e1" font-size="11">常用通信/PWM</text>
  </g>

  <!-- 中间芯片本体 (LQFP48) -->
  <rect x="330" y="130" width="240" height="240" fill="url(#chipBg)" stroke="#38bdf8" stroke-width="2" rx="10" filter="url(#neonGlow)"/>
  
  <!-- 芯片定位点 (Pin 1 标识) -->
  <circle cx="350" cy="150" r="6" fill="#00f0ff"/>
  
  <!-- 芯片文字标识 -->
  <text x="450" y="235" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="16" font-weight="900" text-anchor="middle">STM32F103C8T6</text>
  <text x="450" y="258" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ARM Cortex-M3 72MHz</text>
  <text x="450" y="278" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">64KB FLASH | 20KB SRAM</text>

  <!-- ================= 左侧引脚 (Pin 1 ~ 12) ================= -->
  <!-- Pin 1: VBAT -->
  <line x1="240" y1="150" x2="330" y2="150" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="240" cy="150" r="4" fill="#f59e0b"/>
  <text x="230" y="154" fill="#f59e0b" font-size="12" font-family="monospace" text-anchor="end" font-weight="bold">1. VBAT (纽扣电池 1.8~3.6V)</text>

  <!-- Pin 2: PC13 -->
  <line x1="240" y1="180" x2="330" y2="180" stroke="#00ff88" stroke-width="2.5"/>
  <circle cx="240" cy="180" r="4" fill="#00ff88"/>
  <text x="230" y="184" fill="#00ff88" font-size="12" font-family="monospace" text-anchor="end" font-weight="bold">2. PC13 [板载LED / 低电平亮]</text>

  <!-- Pin 3,4: PC14, PC15 -->
  <line x1="240" y1="210" x2="330" y2="210" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="214" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="end">3. PC14 (OSC32_IN 32.768kHz)</text>
  
  <line x1="240" y1="240" x2="330" y2="240" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="244" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="end">4. PC15 (OSC32_OUT 晶振)</text>

  <!-- Pin 7: NRST -->
  <line x1="240" y1="290" x2="330" y2="290" stroke="#ef4444" stroke-width="2"/>
  <text x="230" y="294" fill="#f87171" font-size="12" font-family="monospace" text-anchor="end" font-weight="bold">7. NRST (硬件复位引脚)</text>

  <!-- Pin 10: PA0 (WKUP) -->
  <line x1="240" y1="330" x2="330" y2="330" stroke="#38bdf8" stroke-width="2"/>
  <text x="230" y="334" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="end" font-weight="bold">10. PA0 (WKUP唤醒 / TIM2_CH1)</text>

  <!-- ================= 右侧引脚 (Pin 25 ~ 36) ================= -->
  <!-- Pin 34: SWDIO (PA13) 绝对保护 -->
  <line x1="570" y1="180" x2="660" y2="180" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="660" cy="180" r="4" fill="#ef4444"/>
  <text x="670" y="184" fill="#ef4444" font-size="12" font-family="monospace" font-weight="bold">34. PA13 [SWDIO 调试严禁复用!]</text>

  <!-- Pin 37: SWCLK (PA14) 绝对保护 -->
  <line x1="570" y1="210" x2="660" y2="210" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="660" cy="210" r="4" fill="#ef4444"/>
  <text x="670" y="214" fill="#ef4444" font-size="12" font-family="monospace" font-weight="bold">37. PA14 [SWCLK 调试严禁复用!]</text>

  <!-- Pin 30,31: PA9, PA10 (USART1) -->
  <line x1="570" y1="260" x2="660" y2="260" stroke="#38bdf8" stroke-width="2"/>
  <text x="670" y="264" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">30. PA9 (USART1_TX 串口发送)</text>

  <line x1="570" y1="290" x2="660" y2="290" stroke="#38bdf8" stroke-width="2"/>
  <text x="670" y="294" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">31. PA10 (USART1_RX 串口接收)</text>

  <!-- ================= 底部引脚 (Pin 13 ~ 24) ================= -->
  <!-- SPI1: PA4~PA7 -->
  <line x1="390" y1="370" x2="390" y2="440" stroke="#c084fc" stroke-width="2"/>
  <text x="390" y="460" fill="#c084fc" font-size="11" font-family="monospace" text-anchor="middle" transform="rotate(45, 390, 460)">PA4~PA7 (SPI1 总线: CS, SCK, MISO, MOSI)</text>

  <!-- I2C2: PB10, PB11 -->
  <line x1="480" y1="370" x2="480" y2="440" stroke="#facc15" stroke-width="2"/>
  <text x="480" y="460" fill="#facc15" font-size="11" font-family="monospace" text-anchor="middle" transform="rotate(45, 480, 460)">PB10/PB11 (I2C2: SCL, SDA / OLED与陀螺仪)</text>

  <!-- 底部安全提示框 -->
  <rect x="80" y="520" width="740" height="70" fill="rgba(239, 68, 68, 0.08)" stroke="#ef4444" stroke-width="1" rx="8"/>
  <text x="100" y="545" fill="#f87171" font-size="13" font-weight="bold">⚠️ 嵌入式学生实战避坑铁律：</text>
  <text x="100" y="568" fill="#fca5a5" font-size="12">1. PA13 / PA14 是 ST-Link 的烧录与调试生命线，切勿在 GPIO_Init 中将其配置为普通 I/O，否则将导致芯片“变砖”无法二次下载！</text>
  <text x="100" y="586" fill="#fca5a5" font-size="12">2. PC13 在多数核心板上反接了板载 LED（低电平导通点亮，高电平熄灭）；PA0 是待机模式唯一可外部唤醒的 WKUP 引脚。</text>
</svg>
